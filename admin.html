<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - NEW GEN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .card {
      background: rgba(20, 20, 40, 0.8);
      border: 1px solid rgba(100, 50, 200, 0.3);
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #9d4edd, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #b8b8d1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(100, 50, 200, 0.3);
      border-radius: 6px;
      background: rgba(30, 30, 60, 0.6);
      color: #e0e0e0;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: rgba(157, 78, 221, 0.8);
      background: rgba(40, 40, 80, 0.8);
      box-shadow: 0 0 12px rgba(157, 78, 221, 0.3);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #9d4edd, #c77dff);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(157, 78, 221, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      margin-top: 15px;
      padding: 12px;
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid rgba(255, 59, 48, 0.5);
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .success-message {
      margin-top: 15px;
      padding: 12px;
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.5);
      border-radius: 6px;
      color: #81c784;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .spinner {
      border: 3px solid rgba(157, 78, 221, 0.2);
      border-top: 3px solid #9d4edd;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Painel Administrativo</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="codigo">Código de Segurança</label>
          <input
            type="password"
            id="codigo"
            name="codigo"
            placeholder="Digite seu código"
            autocomplete="off"
            required
          >
        </div>

        <button type="submit" id="submitBtn">Entrar</button>
      </form>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
      </div>

      <div class="footer">
        <p>Sistema de Administração - NEW GEN</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { AdminSession } from './js/admin/AdminSession.js';

    const form = document.getElementById('loginForm');
    const codigoInput = document.getElementById('codigo');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const loading = document.getElementById('loading');

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    function clearMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();

      const codigo = codigoInput.value.trim();
      if (!codigo) {
        showError('Por favor, digite o código de segurança.');
        codigoInput.focus();
        return;
      }

      submitBtn.disabled = true;
      loading.style.display = 'block';

      try {
        const session = await AdminSession.login(codigo);
        showSuccess('Login bem-sucedido! Redirecionando...');

        setTimeout(() => {
          window.location.href = 'admin.html?dashboard';
        }, 1500);
      } catch (error) {
        submitBtn.disabled = false;
        loading.style.display = 'none';

        const errorMsg = error.message || 'Erro ao fazer login. Tente novamente.';
        showError(errorMsg);
        codigoInput.focus();
      }
    });

    // Focus no input ao carregar
    window.addEventListener('load', () => {
      codigoInput.focus();
    });
  </script>
</body>
</html>
